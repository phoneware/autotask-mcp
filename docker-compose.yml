# HTTP-transport deployment. For stdio (Claude Desktop/Code) run the image
# directly with `docker run -i` instead — stdio needs an attached stdin/stdout
# and is not a long-running service.
#
# MCP sessions are held in instance memory, so do not scale this service to more
# than one replica: a client's session lives on the instance that created it.
services:
  autotask-mcp:
    build: .
    image: ghcr.io/phoneware/autotask-mcp:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      AUTOTASK_TRANSPORT: http
      # Bind to all interfaces inside the container so the published port works.
      AUTOTASK_HTTP_HOST: 0.0.0.0
      PORT: '3000'
      # Provide these via a .env file or your secrets manager:
      AUTOTASK_USERNAME: ${AUTOTASK_USERNAME}
      AUTOTASK_SECRET: ${AUTOTASK_SECRET}
      AUTOTASK_INTEGRATION_CODE: ${AUTOTASK_INTEGRATION_CODE}
      AUTOTASK_HTTP_TOKEN: ${AUTOTASK_HTTP_TOKEN}
      # AUTOTASK_READ_ONLY: 'true'
      # Pin the public hostname once this sits behind a proxy:
      # AUTOTASK_HTTP_ALLOWED_HOSTS: mcp.autotask.example.com
      # Autotask's hourly budget is shared tenant-wide; see README.
      # AUTOTASK_THRESHOLD_STOP_PCT: '90'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
