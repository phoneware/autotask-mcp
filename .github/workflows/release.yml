name: Release

# Tagging cuts a GitHub Release for this fork. It deliberately does NOT publish
# to npm: this is Phoneware's fork of veeemlab/autotask-mcp, run as a hosted
# service rather than distributed as a package, and the upstream @veeemlab scope
# is not ours to publish into. The package is marked private for the same
# reason. The deployable artifact is the Cloud Run image built by
# cloudbuild.yaml on pushes to main, plus the GHCR image built on tags.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub Release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
