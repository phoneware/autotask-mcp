# Cloud Build pipeline for the Phoneware-hosted Autotask MCP.
#
# Invoked by .github/workflows/deploy.yml on pushes to main (Workload Identity
# Federation, no static keys). Runs the full test gate, builds the image, pushes
# it to Artifact Registry, and deploys to Cloud Run.
#
# IMPORTANT: env vars are managed OUTSIDE this file. The deploy step passes no
# --set-env-vars, so Cloud Run carries every var over from the currently-serving
# revision (AUTOTASK_USERNAME, AUTOTASK_INTEGRATION_CODE, AUTOTASK_TRANSPORT,
# AUTOTASK_HTTP_HOST, ...). Adding --set-env-vars here would wipe all of them on
# the next deploy. To change one:
#   gcloud run services update autotask-mcp \
#     --region=us-central1 --update-env-vars="KEY=value"

steps:
  # 1. Quality gate. Never ship an image that fails lint, format, or tests.
  - id: test
    name: 'node:22-alpine'
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        npm ci
        npm run lint
        npm run format:check
        npm test
        npm run build

  # 2. Build the production image (commit-sha tag + latest).
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['test']
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/autotask-mcp:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/autotask-mcp:latest'
      - '.'

  - id: push
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/autotask-mcp'

  # 3. Deploy. MCP Streamable HTTP sessions live in instance memory, so the
  #    service is pinned to a single always-warm instance: scaling out would
  #    strand sessions on the wrong instance, and scaling to zero would drop
  #    every live session on each cold start. Session affinity is belt and
  #    braces on top of that.
  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['push']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'autotask-mcp'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/autotask-mcp:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=3000'
      - '--allow-unauthenticated'
      - '--min-instances=1'
      - '--max-instances=1'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=3600'
      - '--session-affinity'

substitutions:
  _REGION: us-central1
  _REPO: autotask-mcp

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/autotask-mcp:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/autotask-mcp:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
